name: scenario-suite

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: §15 scenario harness + adequacy smoke
        run: |
          PYTHONPATH=group_a/adequacy:group_a/strategy:group_a/cognitive:group_a/broker/mt5-bridge:shared/halt-coordinator:shared/control-api:shared/fact-log:shared/treasury:shared/capital:shared/rcb \
            python -m unittest \
              group_a/adequacy/tests/test_scenario_runner.py \
              group_a/adequacy/tests/test_adequacy.py \
              group_a/adequacy/tests/test_champion.py
          PYTHONPATH=group_a/adequacy:group_a/strategy:group_a/cognitive:group_a/broker/mt5-bridge:group_a/runtime:shared/halt-coordinator:shared/control-api \
            python -m sate_adequacy.scenario_runner
          PYTHONPATH=group_a/adequacy:group_a/strategy:group_a/cognitive:group_a/broker/mt5-bridge:group_a/runtime:shared/halt-coordinator:shared/control-api \
            python -m sate_adequacy.bootstrap
