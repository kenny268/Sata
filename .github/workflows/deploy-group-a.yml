name: deploy-group-a

on:
  push:
    branches: [main]
    paths:
      - "group_a/**"
      - ".github/workflows/deploy-group-a.yml"
  pull_request:
    paths:
      - "group_a/**"
      - ".github/workflows/deploy-group-a.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint KERNEL-A
        working-directory: group_a/kernel
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test KERNEL-A stub
        working-directory: group_a/kernel
        run: cargo test --workspace
      - name: Dependency scan
        if: github.event_name == 'workflow_dispatch'
        working-directory: group_a/kernel
        run: |
          cargo generate-lockfile
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and test Python stubs
        run: |
          pip install "ruff==0.17.2" cryptography jsonschema
          ruff check group_a shared
          PYTHONPATH=group_a/strategy:group_a/cognitive:group_a/adequacy:group_a/runtime:group_a/broker/mt5-bridge:shared/halt-coordinator:shared/fact-log python -m unittest discover -s group_a/strategy/tests -t group_a/strategy
          PYTHONPATH=group_a/adequacy:group_a/strategy:group_a/cognitive:group_a/live-l1:group_a/broker/mt5-bridge:group_a/runtime:shared/halt-coordinator:shared/control-api:shared/fact-log:shared/treasury:shared/capital:shared/rcb:shared/notifier-email python -m unittest discover -s group_a/adequacy/tests -t group_a/adequacy
          PYTHONPATH=group_a/cognitive:shared/fact-log python -m unittest discover -s group_a/cognitive/tests -t group_a/cognitive
          PYTHONPATH=group_a/identity:shared/fact-log python -m unittest discover -s group_a/identity/tests -t group_a/identity
          PYTHONPATH=group_a/release:shared/fact-log python -m unittest discover -s group_a/release/tests -t group_a/release
          PYTHONPATH=group_a/runtime:shared/fact-log python -m unittest discover -s group_a/runtime/tests -t group_a/runtime
          PYTHONPATH=group_a/broker/mt5-bridge python -m unittest discover -s group_a/broker/mt5-bridge/tests -t group_a/broker/mt5-bridge
          PYTHONPATH=group_a/compliance:group_a/live-readiness:group_a/cognitive:group_a/adequacy:group_a/live-l1:group_a/broker/mt5-bridge:shared/fact-log:shared/control-api:shared/halt-coordinator:shared/backup:shared/constitution python -m unittest discover -s group_a/compliance/tests -t group_a/compliance
          PYTHONPATH=group_a/broker/mt5-bridge python -m unittest group_a/broker/mt5-bridge/tests/test_bat.py
          PYTHONPATH=group_a/live-readiness:group_a/compliance:group_a/cognitive:group_a/adequacy:group_a/live-l1:group_a/strategy:shared/backup:shared/constitution:shared/control-api:shared/fact-log:shared/halt-coordinator python -m unittest discover -s group_a/live-readiness/tests -t group_a/live-readiness
          PYTHONPATH=group_a/live-l1:group_a/live-readiness:group_a/compliance:group_a/cognitive:group_a/strategy:group_a/adequacy:group_a/broker/mt5-bridge:group_a/runtime:shared/backup:shared/constitution:shared/control-api:shared/fact-log:shared/halt-coordinator:shared/rcb:shared/capital python -m unittest discover -s group_a/live-l1/tests -t group_a/live-l1
      - name: Publish sha-named artifact
        uses: actions/upload-artifact@v4
        with:
          name: group-a-${{ github.sha }}
          path: group_a/infra/compose.yaml
          if-no-files-found: error
      - name: Immutable release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "sate-ci"
          git config user.email "ci@sate.local"
          git tag "group-a-${GITHUB_SHA}"
          git push origin "group-a-${GITHUB_SHA}"
