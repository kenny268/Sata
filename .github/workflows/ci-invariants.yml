name: ci-invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pip install ruff && ruff check shared group_a
      - name: Repository invariants and scope gate
        run: python -m unittest shared/ci/tests/test_repo_invariants.py shared/control-api/tests/test_scope.py shared/fact-log/tests/test_log.py group_a/strategy/tests/test_boundary.py group_a/identity/tests/test_registry.py group_a/identity/tests/test_config.py group_a/identity/tests/test_sourced.py
        env:
          PYTHONPATH: shared/control-api:shared/fact-log:group_a/strategy:group_a/identity
