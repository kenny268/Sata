name: ci-invariants

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pip install "ruff==0.17.2" cryptography jsonschema && ruff check shared group_a
      - name: Repository invariants and scope gate
        run: python -m unittest shared/ci/tests/test_repo_invariants.py shared/ci/tests/test_phase14_tracker.py shared/ci/tests/test_phase15_tracker.py shared/ci/tests/test_phase16_tracker.py shared/ci/tests/test_phase17_tracker.py shared/ci/tests/test_phase18_tracker.py shared/ci/tests/test_phase19_tracker.py shared/ci/tests/test_phase20_tracker.py shared/ci/tests/test_phase21_tracker.py shared/ci/tests/test_phase22_tracker.py shared/ci/tests/test_phase23_tracker.py shared/ci/tests/test_phase24_tracker.py shared/ci/tests/test_phase25_tracker.py shared/ci/tests/test_phase26_tracker.py shared/ci/tests/test_credential_boundary.py shared/control-api/tests/test_scope.py shared/control-api/tests/test_kill.py shared/control-api/tests/test_checkin.py shared/control-api/tests/test_checkin_service.py shared/control-api/tests/test_router.py shared/control-api/tests/test_iso_scope.py shared/control-api/tests/test_preflight.py shared/control-api/tests/test_http.py shared/control-api/tests/test_passkey.py shared/control-api/tests/test_ratify_wire.py shared/halt-coordinator/tests/test_halt.py shared/notifier-email/tests/test_reminder.py shared/notifier-email/tests/test_smtp.py shared/notifier-email/tests/test_ops_and_c6.py shared/notifier-bot/tests/test_alive.py shared/notifier-bot/tests/test_reminder.py shared/notifier-bot/tests/test_negative_auth.py shared/notifier-bot/tests/test_confirm_flows.py shared/notifier-bot/tests/test_delivery.py shared/notifier-bot/tests/test_replay.py shared/notifier-bot/tests/test_p1_commands.py shared/fact-log/tests/test_log.py shared/capital/tests/test_ledger.py shared/treasury/tests/test_treasury.py shared/treasury/tests/test_cost_allocation.py shared/rcb/tests/test_rcb.py shared/constitution/tests/test_constitution.py group_a/release/tests/test_release.py group_a/runtime/tests/test_journal.py group_a/strategy/tests/test_boundary.py group_a/strategy/tests/test_sizing.py group_a/strategy/tests/test_regime_and_signals.py group_a/strategy/tests/test