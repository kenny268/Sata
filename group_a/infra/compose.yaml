# A-only control plane for local and CI checks.
# KERNEL-A and the MT5 terminals are not defined here. They belong on the
# Windows exec host, and that host choice is still A-DEC-07.
# No broker credentials and no published ports.
# The identity volume is the Group A database, not a shared store.

name: sate-group-a

x-group-a: &group-a
  SATE_GROUP_SCOPE: A

services:
  fact-log:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "-m", "sate_factlog.bootstrap"]
    environment:
      <<: *group-a
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      SATE_FACTLOG_DB: /data/staging.db
    volumes:
      - ../../shared/fact-log:/app:ro
      - factlog-data:/data
    networks: [a-control]
    read_only: true
    restart: "no"
  control-api:
    image: alpine:3.20
    command: ["echo", "control-api phase-1 placeholder"]
    environment: *group-a
    networks: [a-control]
    read_only: true
    restart: "no"
  notifier-bot:
    image: alpine:3.20
    command: ["echo", "notifier-bot phase-1 placeholder"]
    environment: *group-a
    networks: [a-control]
    read_only: true
    restart: "no"
  monitoring:
    image: alpine:3.20
    command: ["echo", "monitoring phase-1 placeholder"]
    environment: *group-a
    networks: [a-control]
    read_only: true
    restart: "no"
  identity:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "-m", "sate_identity.bootstrap"]
    environment:
      <<: *group-a
      PYTHONPATH: /app:/factlog
      PYTHONDONTWRITEBYTECODE: "1"
      SATE_IDENTITY_DB: /data/staging.db
      SATE_FACTLOG_DB: /factlog-data/staging.db
    volumes:
      - ../identity:/app:ro
      - ../../shared/fact-log:/factlog:ro
      - factlog-data:/factlog-data:ro
      - identity-data:/data
    depends_on:
      - fact-log
    networks: [a-control]
    read_only: true
    restart: "no"

  capital:
    image: python:3.12-alpine
    working_dir: /app
    command: ["python", "-m", "sate_capital.bootstrap"]
    environment:
      <<: *group-a
      PYTHONPATH: /app:/factlog
      PYTHONDONTWRITEBYTECODE: "1"
      SATE_CAPITAL_DB: /data/staging.db
      SATE_FACTLOG_DB: /factlog-data/staging.db
    volumes:
      - ../../shared/capital:/app:ro
      - ../../shared/fact-log:/factlog:ro
      - factlog-data:/factlog-data:ro
      - capital-data:/data
    depends_on:
      - fact-log
    networks: [a-control]
    read_only: true
    restart: "no"

  rcb:
    image: python:3.12-alpine
    command: python -m sate_rcb.bootstrap
    environment:
      <<: *group-a
      PYTHONPATH: /app:/factlog:/capital
      PYTHONDONTWRITEBYTECODE: "1"
      SATE_RCB_DB: /data/staging.db
      SATE_FACTLOG_DB: /factlog-data/staging.db
    volumes:
      - ../../shared/rcb:/app:ro
      - ../../shared/capital:/capital:ro
      - ../../shared/fact-log:/factlog:ro
      - factlog-data:/factlog-data:ro
      - rcb-data:/data
    depends_on:
      - fact-log
    networks: [a-control]
    read_only: true
    restart: "no"

networks:
  a-control:
    name: sate-a-control
    driver: bridge

volumes:
  identity-data:
    name: sate-a-identity
  factlog-data:
    name: sate-a-factlog
  capital-data:
    name: sate-a-capital
  rcb-data:
    name: sate-a-rcb
