[project]
name = "sate-strategy-a"
version = "0.20.0"
description = "Group A strategy engine: signals, sizing, SIM loop. No broker credentials."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["sate_strategy_a*"]
